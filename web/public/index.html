<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="https://charliemax.dev/favicon.ico">
    <link rel="stylesheet" href="https://charliemax.dev/css/stylesheet.css">
    <title>katara</title>
    <style>
.canvas-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
}

.camera-container,
.sim-container {
    display: flex;
    justify-content: center;
    align-items: center;
}

#cameraCanvas {
    width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

#canvas {
    width: 100%;
    height: auto;
    max-height: 90vh;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

@media (max-width: 900px) {
    .canvas-row {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>
<nav></nav>
<script src="https://charliemax.dev/js/lightmode.js"></script>
<body>
    <div id="content" style="text-align: center">
        <h1>katara</h1>
    </div>
    <div class="canvas-row">
        <div class="sim-container">
            <canvas id="canvas"></canvas>
        </div>
        <div class="camera-container">
            <canvas id="cameraCanvas" width="600" height="400"></canvas>
        </div>
    </div>
    <script src="katara.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
