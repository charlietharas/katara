<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking Visualization</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="canvas-container">
            <canvas id="canvas" width="640" height="480"></canvas>
            <video id="inputVideo" autoplay playsinline style="display:none;"></video>
        </div>

        <div class="controls">
            <button id="startButton">Start Camera</button>
            <button id="stopButton" disabled>Stop Camera</button>
            <div class="status" id="status">Initializing...</div>
            <div class="performance">
                <span id="fps">FPS: 0</span>
                <span id="latency">Latency: 0ms</span>
                <span id="hands">Hands: 0</span>
            </div>
        </div>

        <div class="info">
            <p>Uses MediaPipe for hand tracking and WebAssembly (WASM) for rendering.</p>
            <p>Camera feed is processed entirely in your browser - no data is sent to any server.</p>
            <p>Compatible with GitHub Pages and other static hosting services.</p>
        </div>
    </div>

    <!-- Main application (will load WASM module dynamically) -->
    <script type="module" src="../js/app.js"></script>
</body>
</html>
