name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [web-deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.58'
          actions-cache-folder: 'emsdk-cache'

      - name: Verify Emscripten setup
        run: |
          echo "Emscripten version:"
          emcc --version
          echo "CMake version:"
          cmake --version

      - name: Configure CMake
        working-directory: web
        run: |
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: web
        run: |
          cmake --build build --config Release

      - name: Verify build artifacts
        run: |
          echo "Checking web/public directory:"
          ls -lh web/public/
          echo ""
          echo "Checking for required files:"
          test -f web/public/katara.js && echo "✓ katara.js found"
          test -f web/public/katara.wasm && echo "✓ katara.wasm found"
          test -f web/public/index.html && echo "✓ index.html found"
          test -f web/public/app.js && echo "✓ app.js found"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
